---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: evolvefit

---
# ConfigMap for environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: evolvefit-config
  namespace: evolvefit
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"

---
# Secret for sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: evolvefit-secrets
  namespace: evolvefit
type: Opaque
stringData:
  GOOGLE_GENAI_API_KEY: "your_key_here"
  SUPABASE_URL: "your_url_here"
  SUPABASE_KEY: "your_key_here"
  CLOUDFLARE_API_TOKEN: "your_token_here"
  REDIS_PASSWORD: "your_password_here"

---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: evolvefit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: redis-storage
          mountPath: /data
        command:
        - redis-server
        - "--appendonly"
        - "yes"
        - "--maxmemory"
        - "500mb"
        - "--maxmemory-policy"
        - "allkeys-lru"
      volumes:
      - name: redis-storage
        emptyDir: {}

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: evolvefit
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  clusterIP: None

---
# API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evolvefit-api
  namespace: evolvefit
  labels:
    app: evolvefit-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: evolvefit-api
  template:
    metadata:
      labels:
        app: evolvefit-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/metrics"
    spec:
      containers:
      - name: api
        image: evolvefit/api:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: evolvefit-config
              key: NODE_ENV
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: evolvefit-config
              key: LOG_LEVEL
        - name: PORT
          value: "3000"
        - name: REDIS_HOST
          value: redis-service
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: evolvefit-secrets
              key: REDIS_PASSWORD
        - name: GOOGLE_GENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: evolvefit-secrets
              key: GOOGLE_GENAI_API_KEY
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: evolvefit-secrets
              key: SUPABASE_URL
        - name: SUPABASE_KEY
          valueFrom:
            secretKeyRef:
              name: evolvefit-secrets
              key: SUPABASE_KEY
        - name: CLOUDFLARE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: evolvefit-secrets
              key: CLOUDFLARE_API_TOKEN
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 2
        
        # Resource management
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      
      # Pod termination grace period
      terminationGracePeriodSeconds: 30
      
      # Restart policy
      restartPolicy: Always

---
# API Service (Internal)
apiVersion: v1
kind: Service
metadata:
  name: evolvefit-service
  namespace: evolvefit
spec:
  selector:
    app: evolvefit-api
  type: ClusterIP
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP

---
# API Service (External Load Balancer)
apiVersion: v1
kind: Service
metadata:
  name: evolvefit-loadbalancer
  namespace: evolvefit
spec:
  selector:
    app: evolvefit-api
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  - name: https
    port: 443
    targetPort: 3000
    protocol: TCP

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: evolvefit-hpa
  namespace: evolvefit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: evolvefit-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max

---
# Pod Disruption Budget (for high availability)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: evolvefit-pdb
  namespace: evolvefit
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: evolvefit-api

---
# Ingress (if using Nginx Ingress Controller)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: evolvefit-ingress
  namespace: evolvefit
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - evolvefit.com
    secretName: evolvefit-tls
  rules:
  - host: evolvefit.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: evolvefit-service
            port:
              number: 3000

---
# NetworkPolicy (optional, for security)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: evolvefit-network-policy
  namespace: evolvefit
spec:
  podSelector:
    matchLabels:
      app: evolvefit-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 6379  # Redis
    - protocol: TCP
      port: 443   # External APIs
    - protocol: TCP
      port: 53    # DNS
    - protocol: UDP
      port: 53    # DNS
